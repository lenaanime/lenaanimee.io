<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кайро - портфолио</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1 class="title">KAIRO</h1>
            <p class="subtitle">Портфолио красивого кота</p>
        </div>
    </header>

    <nav class="nav">
        <div class="nav-content">
            <a href="#gallery" class="nav-link">Галерея</a>
            <a href="#about" class="nav-link">О Кайро</a>
        </div>
    </nav>

    <main>
        <section id="about" class="about">
            <div class="about-content">
                <div class="about-text">
                    <h2>Встречайте Кайро</h2>
                    <p>Самый очаровательный и умный кот этого века. Каждый день он дарит нам улыбки, мудрые взгляды и бесценные моменты.</p>
                </div>
            </div>
        </section>

        <section id="gallery" class="gallery">
            <h2 class="gallery-title">Галерея моментов</h2>
            <div class="gallery-grid">
                <div class="gallery-item" onclick="openModal(0)">
                    <img src="благородный кайро/1.jpg" alt="Кайро">
                </div>
                <div class="gallery-item" onclick="openModal(1)">
                    <img src="благородный кайро/2.jpg" alt="Кайро">
                </div>
                <div class="gallery-item" onclick="openModal(2)">
                    <img src="благородный кайро/3.jpg" alt="Кайро">
                </div>
                <div class="gallery-item" onclick="openModal(3)">
                    <img src="благородный кайро/4.jpg" alt="Кайро">
                </div>
                <div class="gallery-item" onclick="openModal(4)">
                    <img src="благородный кайро/5.jpg" alt="Кайро">
                </div>
                <div class="gallery-item" onclick="openModal(5)">
                    <img src="благородный кайро/6.jpg" alt="Кайро">
                </div>
                <div class="gallery-item" onclick="openModal(6)">
                    <img src="благородный кайро/7.jpg" alt="Кайро">
                </div>
                <div class="gallery-item" onclick="openModal(7)">
                    <img src="благородный кайро/8.jpg" alt="Кайро">
                </div>
                <div class="gallery-item" onclick="openModal(8)">
                    <img src="благородный кайро/9.jpg" alt="Кайро">
                </div>

            </div>
        </section>
    </main>

    <div id="modal" class="modal">
        <span class="close" onclick="closeModal()">&times;</span>
        <div class="modal-content">
            <img id="modal-image" src="" alt="Кайро">
            <div class="modal-info">
                <h2 id="modal-title"></h2>
                <p id="modal-description"></p>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2026 Портфолио Кайро. Сделано с 💛 | <a href="https://lenaanime.io" target="_blank">lenaanime.io</a></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
